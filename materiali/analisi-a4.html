<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<title>Come vi trovano online</title>
<style>
  /* Stesso stile del foglio A4 (foglio-a4.html): A4, font di sistema per documenti. L'esito ha sempre la parola, non solo il colore. */
  @page { size: A4; margin: 12mm; }
  :root { --inchiostro: #1c1c1e; --secondario: #4a4a4f; --accento: #0062cc; --fondo: #f2f2f7; --bene: #1b7f3b; --male: #b3261e; --medio: #8a5a00; }
  * { box-sizing: border-box; margin: 0; }
  body { font-family: "Helvetica Neue", Arial, sans-serif; color: var(--inchiostro); font-size: 12pt; line-height: 1.35; }
  h1 { font-size: 25pt; line-height: 1.1; }
  .nome { font-size: 17pt; color: var(--accento); font-weight: 700; margin-top: 2mm; }
  .fonte { font-size: 10pt; color: var(--secondario); margin-top: 1.5mm; }
  table { width: 100%; border-collapse: collapse; margin: 6mm 0; }
  td { padding: 2.6mm 2mm; border-bottom: 0.3mm solid #d1d1d6; vertical-align: top; }
  td:first-child { font-weight: 700; width: 32%; }
  td:nth-child(2) { width: 22%; font-weight: 700; white-space: nowrap; }
  .bene td:nth-child(2) { color: var(--bene); }
  .migliorabile td:nth-child(2) { color: var(--medio); }
  .manca td:nth-child(2) { color: var(--male); }
  h2 { font-size: 16pt; margin-bottom: 2mm; }
  #mancanze { background: var(--fondo); border-radius: 3mm; padding: 4mm 4mm 4mm 10mm; }
  #mancanze li { margin: 1.2mm 0; }
  .contatti { margin-top: 6mm; padding: 5mm 6mm; border: 0.6mm solid var(--accento); border-radius: 3mm; display: flex; justify-content: space-between; align-items: center; gap: 6mm; }
  .contatti p:first-child { font-size: 13pt; font-weight: 700; }
  .contatti .tel { color: var(--accento); text-align: right; }
</style>
</head>
<body>
  <h1>Come vi trovano online</h1>
  <p class="nome" data-campo="nome"></p>
  <p class="fonte" data-campo="fonte"></p>
  <table><tbody id="voci"></tbody></table>
  <h2>Cosa vi manca, e come lo sistemiamo</h2>
  <ul id="mancanze"></ul>
  <div class="contatti">
    <p data-campo="agenzia"></p>
    <p class="tel" data-campo="contatto"></p>
  </div>
</body>
</html>
