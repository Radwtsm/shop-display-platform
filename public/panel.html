<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Offerte sulla TV</title>
<link rel="stylesheet" href="/tokens.css">
<link rel="stylesheet" href="/panel.css">
<script type="module" src="/assets/panel.js"></script>
</head>
<body>
<div id="avviso" class="avviso" role="alert" hidden>
  <p id="avviso-testo"></p>
  <button type="button" id="riprova" class="testo-azione" hidden>Riprova</button>
</div>
<main id="sezioni">
  <header class="testata">
    <span id="marchio" class="marchio" aria-hidden="true"></span>
    <img id="logo" class="marchio" alt="" hidden>
    <span id="nome-negozio" class="nome-negozio"></span>
  </header>
</main>

<div id="toast" class="toast" role="status" aria-live="polite" hidden>
  <span id="toast-testo"></span>
  <button type="button" id="toast-annulla" class="toast-azione">Annulla</button>
</div>
</body>
</html>
