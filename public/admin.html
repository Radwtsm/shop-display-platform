<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Agenzia</title>
<link rel="stylesheet" href="/tokens.css">
<link rel="stylesheet" href="/admin.css">
<script type="module" src="/assets/admin.js"></script>
</head>
<body>
<svg class="nascosto" aria-hidden="true">
  <symbol id="i-schermo" viewBox="0 0 24 24"><rect x="2" y="4" width="20" height="13" rx="2"/><path d="M8 21h8M12 17v4"/></symbol>
  <symbol id="i-eliminacode" viewBox="0 0 24 24"><path d="M4 5h16v4a3 3 0 0 0 0 6v4H4v-4a3 3 0 0 0 0-6z"/><path d="M10 9h4M10 15h4"/></symbol>
  <symbol id="i-menu-qr" viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><path d="M14 14h3v3M21 14v7h-7v-3"/></symbol>
  <symbol id="i-haccp" viewBox="0 0 24 24"><path d="M10 14V5a2 2 0 0 1 4 0v9a4 4 0 1 1-4 0z"/><path d="M12 10v7"/></symbol>
  <symbol id="i-fidelity" viewBox="0 0 24 24"><rect x="2" y="5" width="20" height="14" rx="2"/><path d="M2 10h20M6 15h4"/></symbol>
  <symbol id="i-prenotazioni" viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></symbol>
  <symbol id="i-magazzino" viewBox="0 0 24 24"><path d="M3 8l9-5 9 5v10l-9 5-9-5z"/><path d="M3 8l9 5 9-5M12 13v10"/></symbol>
  <symbol id="i-it-gestito" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="7" rx="2"/><rect x="3" y="13" width="18" height="7" rx="2"/><path d="M7 7.5h.01M7 16.5h.01"/></symbol>
  <symbol id="i-vetrina" viewBox="0 0 24 24"><path d="M4 10v10h16V10M3 4h18l-1 6H4z"/><path d="M10 20v-5h4v5"/></symbol>
  <symbol id="i-servizi" viewBox="0 0 24 24"><path d="M12 3l9 5-9 5-9-5z"/><path d="M3 13l9 5 9-5"/></symbol>
</svg>
<nav class="navigazione" aria-label="Sezioni">
  <p class="app-nome"><span class="app-icona" aria-hidden="true"></span>Agenzia</p>
  <a href="#panoramica" data-sezione="panoramica">
    <svg aria-hidden="true" viewBox="0 0 24 24"><rect x="3" y="3" width="8" height="8" rx="2"/><rect x="13" y="3" width="8" height="8" rx="2"/><rect x="3" y="13" width="8" height="8" rx="2"/><rect x="13" y="13" width="8" height="8" rx="2"/></svg>
    <span>Panoramica</span>
  </a>
  <a href="#clienti" data-sezione="clienti">
    <svg aria-hidden="true" viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4.4 3.6-7 8-7s8 2.6 8 7"/></svg>
    <span>Clienti</span>
  </a>
  <a href="#servizi" data-sezione="servizi">
    <svg aria-hidden="true" viewBox="0 0 24 24"><use href="#i-servizi"/></svg>
    <span>Servizi</span>
  </a>
</nav>

<main id="contenuto">
  <section id="sez-panoramica" class="sezione" aria-labelledby="t-panoramica">
    <p id="data-oggi" class="sopratitolo"></p>
    <h1 id="t-panoramica">Buongiorno</h1>
    <div class="riquadri">
      <div class="riquadro"><p class="riquadro-etichetta">Clienti</p><p class="riquadro-valore" id="k-clienti"></p><p class="riquadro-nota" id="k-clienti-nota"></p></div>
      <div class="riquadro"><p class="riquadro-etichetta">Apparecchi accesi</p><p class="riquadro-valore" id="k-dispositivi"></p><p class="riquadro-nota" id="k-dispositivi-nota"></p></div>
      <div class="riquadro"><p class="riquadro-etichetta">Canoni al mese</p><p class="riquadro-valore" id="k-canoni"></p><p class="riquadro-nota">Totale dei canoni attivi</p></div>
      <div class="riquadro"><p class="riquadro-etichetta">Da fare</p><p class="riquadro-valore" id="k-avvisi"></p><p class="riquadro-nota" id="k-avvisi-nota"></p></div>
    </div>
    <h2 class="titolo-sezione">Da fare</h2>
    <ul id="lista-avvisi" class="gruppo" aria-label="Da fare"></ul>
    <p id="tutto-ok" class="vuoto" hidden>Tutto a posto: niente da fare adesso.</p>
    <h2 class="titolo-sezione">Servizi</h2>
    <ul id="servizi-panoramica" class="gruppo" aria-label="Servizi attivi"></ul>
  </section>

  <section id="sez-clienti" class="sezione" aria-labelledby="t-clienti" hidden>
    <p id="clienti-sopra" class="sopratitolo"></p>
    <h1 id="t-clienti">Clienti</h1>
    <label class="cerca">
      <span class="nascosto">Cerca tra i clienti</span>
      <input id="cerca" type="search" placeholder="Cerca per nome, settore, zona o servizio" autocomplete="off">
    </label>
    <ul id="lista-clienti" class="gruppo" aria-label="Clienti"></ul>
    <p id="nessun-cliente" class="vuoto" hidden>Nessun cliente trovato.</p>
  </section>

  <section id="sez-servizi" class="sezione" aria-labelledby="t-servizi" hidden>
    <p id="servizi-sopra" class="sopratitolo"></p>
    <h1 id="t-servizi">Servizi</h1>
    <ul id="servizi-attivi" class="gruppo" aria-label="Servizi attivi"></ul>
    <h2 class="titolo-sezione">In arrivo</h2>
    <ul id="servizi-in-arrivo" class="gruppo" aria-label="Servizi in arrivo"></ul>
  </section>

  <p id="errore" class="errore-pagina" role="alert" hidden></p>
</main>

<dialog id="scheda" class="scheda" aria-labelledby="sc-nome">
  <div class="scheda-testata">
    <h2 id="sc-nome"></h2>
    <button type="button" class="chiudi" id="sc-chiudi">Fine</button>
  </div>
  <p id="sc-sotto" class="sopratitolo"></p>
  <div id="sc-avvisi"></div>
  <dl id="sc-dati" class="dati gruppo"></dl>
  <div id="sc-corpo"></div>
</dialog>
</body>
</html>
